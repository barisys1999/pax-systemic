window.startMigration = async function() {
    const btn    = document.getElementById('startBtn');
    const logBox = document.getElementById('logBox');
    const summary = document.getElementById('summary');

    btn.disabled = true;
    btn.textContent = '⏳ Yükleniyor...';
    logBox.style.display = 'block';
    logBox.innerHTML = '';

    function log(msg, type = 'inf') {
        const div = document.createElement('div');
        div.className = 'log-item ' + type;
        div.textContent = msg;
        logBox.appendChild(div);
        logBox.scrollTop = logBox.scrollHeight;
    }

    log(`📦 ${YAZILIMLAR.length} yazılım Firebase'e aktarılıyor...`, 'inf');

    let ok = 0, skipped = 0, failed = 0;

    for (const yazilim of YAZILIMLAR) {
        try {
            const ref = doc(db, 'yazilimlar', yazilim.id);
            const snap = await getDoc(ref);

            if (snap.exists()) {
                log(`⏭  "${yazilim.title}" zaten mevcut, atlanıyor.`, 'inf');
                skipped++;
            } else {
                const data = { ...yazilim };
                delete data.id; // id zaten doc key olacak
                data.createdAt = Timestamp.now();
                data.updatedAt = Timestamp.now();
                await setDoc(ref, data);
                log(`✅ "${yazilim.title}" başarıyla eklendi.`, 'ok');
                ok++;
            }
        } catch(e) {
            log(`❌ "${yazilim.title}" eklenirken hata: ${e.message}`, 'err');
            failed++;
        }
    }

    log('', 'inf');
    log(`🏁 Tamamlandı: ${ok} eklendi, ${skipped} atlandı, ${failed} hatalı.`, ok > 0 ? 'ok' : 'inf');

    summary.style.display = 'block';
    summary.className = 'summary ' + (failed === 0 ? 'success' : 'partial');
    summary.textContent = failed === 0
        ? `✅ Migration başarılı! ${ok} yazılım eklendi, ${skipped} zaten mevcuttu. Admin paneli yenileyebilirsiniz.`
        : `⚠️ ${ok} eklendi, ${failed} hatalı. Loglara bakın.`;

    btn.textContent = '✓ Migration Tamamlandı';
};
