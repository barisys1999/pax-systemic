<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <!-- No indexing -->
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #FFFFFF;
            --mist:  #F4F6FB;
            --ink:   #0F1729;
            --slate: #5B6478;
            --fog:   #97A1B5;
            --line:  #E8EBF2;
            --line-strong: #D0D5E3;
            --blue:  #2454FF;
            --blue-soft: rgba(36,84,255,0.08);
            --blue-line: rgba(36,84,255,0.28);
            --green: #0F9B58;
            --green-soft: rgba(15,155,88,0.09);
            --red:   #D63E3E;
            --shadow-sm: 0 1px 4px rgba(15,23,41,0.06), 0 2px 8px rgba(15,23,41,0.04);
            --shadow-md: 0 4px 16px rgba(15,23,41,0.10), 0 1px 4px rgba(15,23,41,0.06);
            --r-sm: 6px; --r-md: 12px; --r-lg: 20px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',system-ui,sans-serif; background:var(--mist); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased; }

        /* ── Login Screen ── */
        #loginScreen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--ink);
            padding: 24px;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--r-lg);
            padding: 48px 44px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .login-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            margin-bottom: 32px;
        }
        .login-logo em { color: #6B9FFF; font-style: normal; }
        .login-card h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }
        .login-card p { font-size: 0.84rem; color: rgba(255,255,255,0.4); margin-bottom: 28px; }
        .login-input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: var(--r-md);
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 14px;
            transition: border-color 0.2s;
        }
        .login-input:focus { border-color: #6B9FFF; }
        .login-input::placeholder { letter-spacing: 0; color: rgba(255,255,255,0.25); }
        .login-btn {
            width: 100%;
            padding: 13px;
            background: var(--blue);
            color: #fff;
            border: none;
            border-radius: var(--r-md);
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.18s;
        }
        .login-btn:hover { background: #1535CC; }
        .login-err { font-size: 0.8rem; color: #F87171; margin-top: 12px; display: none; }
        .login-attempts { font-size: 0.72rem; color: rgba(255,255,255,0.25); margin-top: 10px; }

        /* ── Admin Panel ── */
        #adminPanel { display: none; min-height: 100vh; }

        .admin-header {
            background: var(--ink);
            padding: 0 40px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .admin-header__brand {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.9);
            text-transform: uppercase;
        }
        .admin-header__brand em { color: #6B9FFF; font-style: normal; }
        .admin-header__right { display: flex; align-items: center; gap: 16px; }
        .admin-badge {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 4px 10px;
            background: rgba(36,84,255,0.25);
            color: #6B9FFF;
            border-radius: 20px;
        }
        .logout-btn {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.35);
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: var(--r-sm);
            transition: color 0.18s;
        }
        .logout-btn:hover { color: rgba(255,255,255,0.7); }

        .admin-body { max-width: 1080px; margin: 0 auto; padding: 40px 32px 80px; }

        /* Stats bar */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: var(--r-md);
            padding: 20px 22px;
            box-shadow: var(--shadow-sm);
        }
        .stat-card__num {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: -0.5px;
            line-height: 1;
            margin-bottom: 6px;
        }
        .stat-card__label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--fog);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .toolbar h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--ink);
            flex: 1;
        }
        .toolbar-btn {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--line-strong);
            background: var(--paper);
            color: var(--slate);
            cursor: pointer;
            transition: all 0.18s;
        }
        .toolbar-btn:hover { color: var(--ink); border-color: var(--ink); }
        .toolbar-btn.danger { color: var(--red); border-color: rgba(214,62,62,0.3); }
        .toolbar-btn.danger:hover { background: rgba(214,62,62,0.06); }

        .filter-tabs { display: flex; gap: 4px; margin-bottom: 20px; }
        .ftab {
            font-size: 0.82rem;
            font-weight: 600;
            padding: 7px 16px;
            border-radius: 30px;
            border: 1px solid transparent;
            background: none;
            color: var(--fog);
            cursor: pointer;
            transition: all 0.18s;
        }
        .ftab:hover { color: var(--ink); background: var(--paper); }
        .ftab.active { color: var(--blue); background: var(--blue-soft); border-color: var(--blue-line); }

        /* Feedback list */
        .feedback-list { display: flex; flex-direction: column; gap: 12px; }

        .fb-card {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: var(--r-md);
            padding: 22px 24px;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: border-color 0.18s, box-shadow 0.18s;
            position: relative;
        }
        .fb-card:hover { border-color: var(--blue-line); box-shadow: var(--shadow-md); }
        .fb-card.unread { border-left: 3px solid var(--blue); }

        .fb-card__top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }
        .fb-card__meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .fb-card__name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--ink);
        }
        .fb-card__email {
            font-size: 0.78rem;
            color: var(--fog);
        }
        .type-badge {
            font-size: 0.64rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 3px 9px;
            border-radius: 20px;
            background: var(--blue-soft);
            color: var(--blue);
            border: 1px solid var(--blue-line);
            white-space: nowrap;
        }
        .product-badge {
            font-size: 0.64rem;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 20px;
            background: var(--mist);
            color: var(--slate);
            border: 1px solid var(--line-strong);
            white-space: nowrap;
        }
        .unread-dot {
            width: 8px; height: 8px;
            background: var(--blue);
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 4px;
        }
        .fb-card__time {
            font-size: 0.74rem;
            color: var(--fog);
            white-space: nowrap;
        }
        .fb-card__message {
            font-size: 0.88rem;
            color: var(--slate);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .fb-card__actions {
            display: none;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--line);
            gap: 8px;
            flex-wrap: wrap;
        }
        .fb-card.expanded .fb-card__message { display: block; -webkit-line-clamp: unset; }
        .fb-card.expanded .fb-card__actions { display: flex; }

        .card-action-btn {
            font-size: 0.78rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--line-strong);
            background: var(--paper);
            color: var(--slate);
            cursor: pointer;
            transition: all 0.18s;
        }
        .card-action-btn:hover { color: var(--ink); border-color: var(--ink); }
        .card-action-btn.mark-read { color: var(--green); border-color: rgba(15,155,88,0.3); }
        .card-action-btn.mark-read:hover { background: var(--green-soft); }
        .card-action-btn.del { color: var(--red); border-color: rgba(214,62,62,0.3); }
        .card-action-btn.del:hover { background: rgba(214,62,62,0.06); }

        /* Reply link */
        .reply-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--blue);
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--blue-line);
            background: var(--blue-soft);
            transition: all 0.18s;
        }
        .reply-link:hover { background: rgba(36,84,255,0.15); }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 80px 24px;
            color: var(--fog);
            display: none;
        }
        .empty-state__icon { font-size: 2.5rem; margin-bottom: 16px; }
        .empty-state p { font-size: 0.9rem; }

        /* Loading */
        .loading-state {
            text-align: center;
            padding: 60px;
            color: var(--fog);
            font-size: 0.9rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            display: inline-block;
            width: 18px; height: 18px;
            border: 2px solid var(--line);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @media (max-width: 700px) {
            .admin-body { padding: 24px 16px 60px; }
            .stats-row { grid-template-columns: 1fr 1fr; }
            .admin-header { padding: 0 16px; }
        }
    </style>
</head>
<body>

<!-- ── LOGIN ─────────────────────────────── -->
<div id="loginScreen">
    <div class="login-card">
        <div class="login-logo">PAX <em>SYSTEMIC</em></div>
        <h2>Yönetici Girişi</h2>
        <p>Bu sayfa yalnızca yetkili erişime açıktır.</p>
        <input type="password" id="pwInput" class="login-input" placeholder="Şifre" onkeydown="if(event.key==='Enter') doLogin()">
        <button class="login-btn" onclick="doLogin()">Giriş Yap</button>
        <div class="login-err" id="loginErr">Hatalı şifre. Lütfen tekrar deneyin.</div>
        <div class="login-attempts" id="loginAttempts"></div>
    </div>
</div>

<!-- ── ADMIN PANEL ────────────────────────── -->
<div id="adminPanel">
    <header class="admin-header">
        <div class="admin-header__brand">PAX <em>SYSTEMIC</em></div>
        <div class="admin-header__right">
            <span class="admin-badge">Admin</span>
            <button class="logout-btn" onclick="doLogout()">Çıkış →</button>
        </div>
    </header>

    <div class="admin-body">

        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-card__num" id="statTotal">—</div>
                <div class="stat-card__label">Toplam Mesaj</div>
            </div>
            <div class="stat-card">
                <div class="stat-card__num" id="statUnread">—</div>
                <div class="stat-card__label">Okunmamış</div>
            </div>
            <div class="stat-card">
                <div class="stat-card__num" id="statToday">—</div>
                <div class="stat-card__label">Bugün</div>
            </div>
            <div class="stat-card">
                <div class="stat-card__num" id="statTypes">—</div>
                <div class="stat-card__label">Farklı Tür</div>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <h2>Gelen Kutusu</h2>
            <button class="toolbar-btn" onclick="loadFeedbacks()">↻ Yenile</button>
            <button class="toolbar-btn" onclick="markAllRead()">Tümünü Okundu İşaretle</button>
            <button class="toolbar-btn danger" onclick="clearAll()">Tümünü Sil</button>
        </div>

        <!-- Filter tabs -->
        <div class="filter-tabs">
            <button class="ftab active" data-filter="all"        onclick="setFilter('all', this)">Tümü</button>
            <button class="ftab" data-filter="unread"            onclick="setFilter('unread', this)">Okunmamış</button>
            <button class="ftab" data-filter="Özellik Önerisi"   onclick="setFilter('Özellik Önerisi', this)">Özellik Önerisi</button>
            <button class="ftab" data-filter="Hata Bildirimi"    onclick="setFilter('Hata Bildirimi', this)">Hata</button>
            <button class="ftab" data-filter="Yeni Yazılım Talebi" onclick="setFilter('Yeni Yazılım Talebi', this)">Yeni Talep</button>
        </div>

        <!-- List -->
        <div class="loading-state" id="loadingState">
            <span class="spinner"></span> Mesajlar yükleniyor...
        </div>
        <div class="empty-state" id="emptyState">
            <div class="empty-state__icon">📭</div>
            <p>Henüz bu filtrede mesaj bulunmuyor.</p>
        </div>
        <div class="feedback-list" id="feedbackList"></div>

    </div>
</div>

<script>
    // ── Auth ───────────────────────────────────
    // Şifre hash'i (SHA-256 of "paxadmin2026") — değiştirmek için: update PASS_HASH
    // Mevcut şifre: paxadmin2026
    const PASS_HASH = 'c0082b301330e7d7e8f0f7f0e27dcd69301f05daa98b28ca1c9264654d84545d';

    let loginAttempts = 0;
    let allFeedbacks  = [];
    let currentFilter = 'all';

    async function sha256(str) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    async function doLogin() {
        const pw = document.getElementById('pwInput').value;
        if (!pw) return;

        if (loginAttempts >= 5) {
            document.getElementById('loginErr').textContent = 'Çok fazla hatalı deneme. Sayfayı yenileyin.';
            document.getElementById('loginErr').style.display = 'block';
            return;
        }

        const hash = await sha256(pw);
        if (hash === PASS_HASH) {
            sessionStorage.setItem('pax_admin', '1');
            showPanel();
        } else {
            loginAttempts++;
            document.getElementById('loginErr').style.display = 'block';
            document.getElementById('loginAttempts').textContent = `Kalan deneme: ${5 - loginAttempts}`;
            document.getElementById('pwInput').value = '';
            document.getElementById('pwInput').focus();
        }
    }

    function doLogout() {
        sessionStorage.removeItem('pax_admin');
        location.reload();
    }

    function showPanel() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadFeedbacks();
    }

    // ── Data ───────────────────────────────────
    async function loadFeedbacks() {
        document.getElementById('loadingState').style.display = 'block';
        document.getElementById('feedbackList').innerHTML = '';
        document.getElementById('emptyState').style.display = 'none';

        try {
            const res = await window.storage.get('pax_feedbacks', true);
            allFeedbacks = res && res.value ? JSON.parse(res.value) : [];
        } catch(_) {
            allFeedbacks = [];
        }

        document.getElementById('loadingState').style.display = 'none';
        updateStats();
        renderList();
    }

    function updateStats() {
        const total   = allFeedbacks.length;
        const unread  = allFeedbacks.filter(f => !f.read).length;
        const today   = allFeedbacks.filter(f => {
            const d = new Date(f.timestamp);
            const n = new Date();
            return d.toDateString() === n.toDateString();
        }).length;
        const types   = new Set(allFeedbacks.map(f => f.type)).size;

        document.getElementById('statTotal').textContent  = total;
        document.getElementById('statUnread').textContent = unread;
        document.getElementById('statToday').textContent  = today;
        document.getElementById('statTypes').textContent  = types || '—';
    }

    function setFilter(filter, btn) {
        currentFilter = filter;
        document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderList();
    }

    function renderList() {
        const list = document.getElementById('feedbackList');
        const empty = document.getElementById('emptyState');

        let items = allFeedbacks;
        if (currentFilter === 'unread') {
            items = items.filter(f => !f.read);
        } else if (currentFilter !== 'all') {
            items = items.filter(f => f.type === currentFilter);
        }

        if (items.length === 0) {
            list.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        list.innerHTML = items.map(f => {
            const date = new Date(f.timestamp);
            const timeStr = formatTime(date);
            const mailSubject = encodeURIComponent(`Re: ${f.type} — ${f.product}`);
            const mailBody    = encodeURIComponent(`Merhaba ${f.name},\n\n`);

            return `
            <div class="fb-card ${f.read ? '' : 'unread'}" id="card_${f.id}" onclick="toggleCard('${f.id}')">
                <div class="fb-card__top">
                    <div class="fb-card__meta">
                        ${!f.read ? '<div class="unread-dot"></div>' : ''}
                        <span class="fb-card__name">${esc(f.name)}</span>
                        <span class="fb-card__email">${esc(f.email)}</span>
                        <span class="type-badge">${esc(f.type)}</span>
                        <span class="product-badge">${esc(f.product)}</span>
                    </div>
                    <span class="fb-card__time">${timeStr}</span>
                </div>
                <div class="fb-card__message">${esc(f.message)}</div>
                <div class="fb-card__actions">
                    <a href="mailto:${esc(f.email)}?subject=${mailSubject}&body=${mailBody}"
                       class="reply-link" onclick="event.stopPropagation()">✉ Yanıtla</a>
                    ${!f.read ? `<button class="card-action-btn mark-read" onclick="event.stopPropagation(); markRead('${f.id}')">✓ Okundu İşaretle</button>` : ''}
                    <button class="card-action-btn del" onclick="event.stopPropagation(); deleteOne('${f.id}')">✕ Sil</button>
                </div>
            </div>`;
        }).join('');
    }

    function toggleCard(id) {
        const card = document.getElementById('card_' + id);
        const isExpanded = card.classList.contains('expanded');
        // Collapse all
        document.querySelectorAll('.fb-card.expanded').forEach(c => c.classList.remove('expanded'));
        if (!isExpanded) {
            card.classList.add('expanded');
            // Auto-mark read when opened
            const fb = allFeedbacks.find(f => f.id === id);
            if (fb && !fb.read) markRead(id, true);
        }
    }

    async function markRead(id, silent = false) {
        const fb = allFeedbacks.find(f => f.id === id);
        if (!fb || fb.read) return;
        fb.read = true;
        await saveAll();
        if (!silent) renderList();
        updateStats();
        // Update card visually
        const card = document.getElementById('card_' + id);
        if (card) {
            card.classList.remove('unread');
            const dot = card.querySelector('.unread-dot');
            if (dot) dot.remove();
        }
    }

    async function markAllRead() {
        allFeedbacks.forEach(f => f.read = true);
        await saveAll();
        updateStats();
        renderList();
    }

    async function deleteOne(id) {
        if (!confirm('Bu mesajı silmek istediğinize emin misiniz?')) return;
        allFeedbacks = allFeedbacks.filter(f => f.id !== id);
        await saveAll();
        updateStats();
        renderList();
    }

    async function clearAll() {
        if (!confirm('Tüm mesajları silmek istediğinize emin misiniz? Bu işlem geri alınamaz.')) return;
        allFeedbacks = [];
        await saveAll();
        updateStats();
        renderList();
    }

    async function saveAll() {
        await window.storage.set('pax_feedbacks', JSON.stringify(allFeedbacks), true);
    }

    // ── Helpers ───────────────────────────────
    function esc(str) {
        return String(str || '')
            .replace(/&/g,'&amp;')
            .replace(/</g,'&lt;')
            .replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;');
    }

    function formatTime(date) {
        const now = new Date();
        const diff = (now - date) / 1000;
        if (diff < 60) return 'Az önce';
        if (diff < 3600) return `${Math.floor(diff/60)} dk önce`;
        if (diff < 86400) return `${Math.floor(diff/3600)} sa önce`;
        return date.toLocaleDateString('tr-TR', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
    }

    // ── Auto-login if session exists ──────────
    if (sessionStorage.getItem('pax_admin') === '1') showPanel();
</script>
</body>
</html>
