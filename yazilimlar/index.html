<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../favicon.png">
    <title>Systemic Software | Yazılım Kataloğu</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/catalog.css">

    <!-- Yazılım teması: cyan -->
    <style>
        body {
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.04) 0%, transparent 55%);
        }
        .download-section {
            background: rgba(0, 240, 255, 0.03);
            border-color: rgba(0, 240, 255, 0.10);
        }
    </style>
</head>
<body>

<!-- ── HEADER ───────────────────────────── -->
<header class="site-header">
    <a href="../index.html" class="logo">PAX <em>SYSTEMIC</em></a>
    <div class="header-right">
        <a href="../oyunlar/index.html" class="nav-chip">Oyunlar</a>
        <a href="index.html"            class="nav-chip active-cyan">Yazılımlar</a>
    </div>
</header>

<!-- ── MAIN VIEW ────────────────────────── -->
<div id="main-view" style="display:flex; flex-direction:column; align-items:center;">

    <div class="catalog-hero">
        <h1>Yazılım Kataloğu</h1>
        <p>Yüksek performanslı, minimalist ve güvenilir araçlar.</p>
    </div>

    <div class="controls">
        <div class="search-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Yazılım ara..." oninput="updateGrid()">
        </div>
        <div class="filter-row">
            <button class="filter-btn active" onclick="setCategory('all', this)">Tümü</button>
            <button class="filter-btn" onclick="setCategory('medya', this)">Medya</button>
            <button class="filter-btn" onclick="setCategory('yonetim', this)">Yönetim</button>
            <button class="filter-btn" onclick="setCategory('sistem', this)">Sistem</button>
        </div>
    </div>

    <div id="catalog-grid"></div>
    <div id="no-results">Aradığınız yazılım bulunamadı.</div>

</div>

<!-- ── DETAIL VIEW ──────────────────────── -->
<div id="detail-view">

    <button class="back-btn" onclick="closeProduct()">
        ← Kataloğa Dön
    </button>

    <!-- Header: ikon + başlık -->
    <div class="det-header">
        <div class="det-header__icon">
            <img id="det-icon" src="" alt="">
            <span id="det-icon-placeholder" class="det-header__icon-placeholder" style="display:none"></span>
        </div>
        <div class="det-header__text">
            <h2 id="det-title"></h2>
            <h4 id="det-sub"></h4>
        </div>
    </div>

    <!-- Tabs -->
    <div class="det-tabs">
        <button class="d-tab active" onclick="switchTab('overview', event)">Genel Bakış</button>
        <button class="d-tab"        onclick="switchTab('changelog', event)">Sürüm Notları</button>
    </div>

    <!-- Genel Bakış -->
    <div id="pane-overview" class="tab-pane" style="display:block;">
        <div class="det-overview">
            <div class="det-text">
                <p id="det-desc"></p>
                <ul class="feature-list" id="det-features"></ul>
            </div>
            <div class="det-media" id="det-media"></div>
        </div>
    </div>

    <!-- Sürüm Notları -->
    <div id="pane-changelog" class="tab-pane" style="display:none;">
        <div class="timeline" id="det-changelog"></div>
    </div>

    <!-- İndir -->
    <div class="download-section">
        <a href="#" id="det-btn" class="btn-download">↓ İndir</a>
    </div>

</div>

<!-- Lightbox -->
<div id="lightbox" onclick="this.style.display='none'"></div>

<script src="../js/software-data.js"></script>
<script src="../js/catalog.js"></script>
<script>
    window.onload = () => initCatalog(SOFTWARE_PRODUCTS);
</script>

</body>
</html>
