<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>PAX Systemic | Yazılım Dünyası</title>
    <style>
        :root {
            --primary: #00F0FF;
            --primary-glow: rgba(0, 240, 255, 0.4);
            --bg-dark: #05070A;
            --panel-bg: rgba(13, 17, 26, 0.6);
            --text-main: #F0F4FA;
            --text-dim: #8A9BB8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-dark); color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh;
            display: flex; flex-direction: column; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.03) 0%, transparent 60%);
        }

        header {
            display: flex; justify-content: flex-start; align-items: center;
            padding: 20px 50px; background: rgba(5, 7, 10, 0.85);
            backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0, 240, 255, 0.1);
            position: sticky; top: 0; z-index: 1000;
        }

        .logo-container { text-decoration: none; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.3s; }
        .logo-container:hover { opacity: 0.8; }
        .logo-text { font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; color: var(--text-main); }
        .logo-text span { color: var(--primary); }

        #main-view { width: 100%; display: flex; flex-direction: column; align-items: center; animation: fadeIn 0.5s ease; }
        .hero { text-align: center; padding: 60px 20px 30px; }
        .hero h1 { font-size: 3.5rem; font-weight: 900; margin-bottom: 10px; color: var(--primary); }
        
        .controls-container { width: 100%; max-width: 800px; padding: 0 20px; margin-bottom: 50px; display: flex; flex-direction: column; gap: 25px; align-items: center; }
        .search-box { width: 100%; max-width: 500px; }
        .search-box input {
            width: 100%; padding: 15px 25px; background: rgba(0, 240, 255, 0.02);
            border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 30px;
            color: var(--text-main); font-size: 1.1rem; outline: none; transition: 0.3s;
        }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }

        .filter-tags { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .filter-btn { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--text-dim); padding: 8px 20px; border-radius: 20px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .filter-btn.active { background: rgba(0, 240, 255, 0.1); border-color: var(--primary); color: var(--primary); }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; width: 100%; max-width: 1200px; padding: 0 20px 80px; }
        .product-card { background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 15px; padding: 30px; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; }
        .product-card:hover { border-color: var(--primary); transform: translateY(-5px); background: rgba(0, 240, 255, 0.03); }
        .category-label { font-size: 0.7rem; color: var(--primary); font-weight: bold; text-transform: uppercase; margin-bottom: 10px; display: block; opacity: 0.8; }
        .product-card h3 { font-size: 1.6rem; margin-bottom: 12px; }
        .product-card p { color: var(--text-dim); font-size: 0.95rem; line-height: 1.5; }

        #detail-view { display: none; max-width: 1100px; margin: 40px auto; padding: 0 20px; animation: slideUp 0.4s ease; }
        .back-btn { background: none; color: var(--text-dim); border: none; font-size: 1rem; cursor: pointer; margin-bottom: 25px; transition: 0.3s; }
        .back-btn:hover { color: var(--primary); }
        
        .detail-header { margin-bottom: 30px; }
        .detail-header h2 { font-size: 3.5rem; color: var(--primary); }
        .detail-header h4 { font-size: 1.3rem; color: var(--text-dim); font-weight: 400; }

        .detail-tabs { display: flex; gap: 30px; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .d-tab { background: none; border: none; color: var(--text-dim); font-size: 1.1rem; padding-bottom: 12px; cursor: pointer; transition: 0.3s; border-bottom: 2px solid transparent; }
        .d-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: bold; }

        .detail-content { display: grid; grid-template-columns: 1fr 1.2fr; gap: 50px; align-items: start; margin-bottom: 50px; }
        .detail-text p { font-size: 1.15rem; line-height: 1.8; color: #C0C8D6; margin-bottom: 25px; }
        .feature-list { list-style: none; }
        .feature-list li { margin-bottom: 12px; padding-left: 25px; position: relative; color: var(--text-main); }
        .feature-list li::before { content: '▹'; color: var(--primary); position: absolute; left: 0; font-weight: bold; }

        .detail-media { 
            background: #000; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; 
            aspect-ratio: 16/10; overflow: hidden; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .detail-media img { width: 100%; height: 100%; object-fit: cover; }

        .timeline { border-left: 2px solid rgba(0, 240, 255, 0.2); padding-left: 30px; margin: 20px 0 50px 10px; }
        .timeline-item { position: relative; margin-bottom: 40px; }
        .timeline-item::before { content: ''; position: absolute; left: -37px; top: 8px; width: 12px; height: 12px; background: var(--bg-dark); border: 2px solid var(--primary); border-radius: 50%; }
        .tl-version { font-size: 1.3rem; font-weight: bold; color: var(--primary); margin-right: 15px; }
        .tl-date { color: var(--text-dim); font-size: 0.9rem; }
        .tl-notes { margin-top: 15px; list-style: none; padding-left: 10px; }
        .tl-notes li { margin-bottom: 8px; color: #C0C8D6; font-size: 0.95rem; }

        .download-section { background: rgba(0, 240, 255, 0.03); border: 1px solid rgba(0, 240, 255, 0.1); border-radius: 20px; padding: 50px; text-align: center; }
        .btn-massive { display: inline-block; background: var(--primary); color: #000; text-decoration: none; padding: 18px 60px; font-size: 1.2rem; font-weight: 900; border-radius: 12px; transition: 0.3s; box-shadow: 0 10px 30px var(--primary-glow); }
        .btn-massive:hover { transform: scale(1.05); box-shadow: 0 15px 40px var(--primary-glow); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 900px) { .detail-content { grid-template-columns: 1fr; } .detail-header h2 { font-size: 2.5rem; } .header { padding: 20px; } }
    </style>
</head>
<body>

    <header>
        <div class="logo-container" onclick="closeProduct()">
            <div class="logo-text">PAX <span>SYSTEMIC</span></div>
        </div>
    </header>

    <div id="main-view">
        <div class="hero">
            <h1>Yazılım Kataloğu</h1>
            <p>Yüksek performanslı, minimalist ve güvenilir araçlar.</p>
        </div>

        <div class="controls-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Yazılım ara..." onkeyup="updateUI()">
            </div>
            <div class="filter-tags">
                <button class="filter-btn active" data-cat="all" onclick="setCategory('all', this)">Tümü</button>
                <button class="filter-btn" data-cat="medya" onclick="setCategory('medya', this)">Medya</button>
                <button class="filter-btn" data-cat="yonetim" onclick="setCategory('yonetim', this)">Yönetim</button>
                <button class="filter-btn" data-cat="sistem" onclick="setCategory('sistem', this)">Sistem</button>
            </div>
        </div>

        <div class="grid-container" id="product-grid">
            <!-- JavaScript ile otomatik doldurulacak -->
        </div>

        <div id="no-results" style="display:none; padding: 50px; color: var(--text-dim);">Sonuç bulunamadı.</div>
    </div>

    <div id="detail-view">
        <button class="back-btn" onclick="closeProduct()">← Kataloğa Dön</button>
        <div class="detail-header">
            <h2 id="det-title"></h2>
            <h4 id="det-sub"></h4>
        </div>
        <div class="detail-tabs">
            <button class="d-tab active" onclick="switchTab('overview', event)">Genel Bakış</button>
            <button class="d-tab" onclick="switchTab('changelog', event)">Sürüm Notları</button>
        </div>

        <div id="pane-overview" class="tab-pane" style="display:block;">
            <div class="detail-content">
                <div class="detail-text">
                    <p id="det-desc"></p>
                    <ul class="feature-list" id="det-features"></ul>
                </div>
                <div class="detail-media" id="det-media"></div>
            </div>
        </div>

        <div id="pane-changelog" class="tab-pane" style="display:none;">
            <div class="timeline" id="det-changelog"></div>
        </div>

        <div class="download-section">
            <a href="#" id="det-btn" class="btn-massive">İndir</a>
        </div>
    </div>

    <script>
        const products = [
            {
                id: 'bstreamer',
                category: 'medya',
                catName: 'Medya Araçları',
                title: 'B-Streamer',
                subtitle: 'Gelişmiş Medya İndirme & Dönüştürme Yöneticisi',
                shortDesc: 'Gelişmiş medya indirme ve çoklu format dönüştürme yöneticisi.',
                fullDesc: 'C# ve .NET 8.0 altyapısıyla geliştirilmiş, yüksek performanslı medya yöneticisi. Minimalist arayüzü sayesinde arka planda kaynak tüketmeden çalışır ve kompleks indirme işlemlerini sistemleştirir.',
                features: ['PAX SYSTEMIC Özel Derleme Sihirbazı', 'Çoklu Format (MP4, MP3) Dönüşüm Desteği', 'Yüksek Hızlı Paralel İndirme Kuyruğu', 'Düşük İşlemci ve RAM Kullanımı'],
                image: 'gorseller/bstreamer.png',
                link: '#',
                changelog: [
                    { version: 'v1.2.0', date: 'Mayıs 2026', notes: ['İndirme motoru stabilize edildi.', 'Arayüz hızı artırıldı.'] },
                    { version: 'v1.0.0', date: 'Mart 2026', notes: ['İlk stabil sürüm yayınlandı.'] }
                ]
            },
            {
                id: 'isletme',
                category: 'yonetim',
                catName: 'Yönetim / İşletme',
                title: 'NetKasa Pro',
                subtitle: 'Kurumsal Yönetim & Muhasebe Paneli',
                shortDesc: 'Kurumsal veriler için modern arayüzlü envanter yönetim sistemi.',
                fullDesc: 'İşletmenizin finansal damarlarını tek merkezden yönetin. Pax Systemic ile geliştirilen bu sistem, envanter hareketlerinden cari hesap takibine kadar her süreci yüksek performans ve sıfır gecikme ile dijitalleştirir.',
                features: ['Minimalist Dark Arayüz', 'Anlık Veritabanı Senkronizasyonu', 'Gelişmiş Filtreleme ve Raporlama', 'SQL Tabanlı Güçlü Veri Güvenliği'],
                image: 'gorseller/isletme.png',
                link: '#',
                changelog: [
                    { version: 'v2.5', date: 'Mayıs 2026', notes: ['UI/UX tamamen modernize edildi.', 'Hız %40 artırıldı.'] }
                ]
            },
            {
                id: 'systemic',
                category: 'sistem',
                catName: 'Sistem Araçları',
                title: 'Systemic Pro',
                subtitle: 'Hepsi Bir Arada Optimizasyon Aracı',
                shortDesc: 'Cihaz temizliği, hız testi ve sistem bilgilerini içeren hepsi bir arada araç.',
                fullDesc: 'Sisteminizi hızlı, temiz ve kontrol altında tutan profesyonel bir araç setidir. Cihaz temizliği, anlık ağ hız testi ve detaylı donanım izleme özelliklerini tek bir mühür altında toplar.',
                features: ['Akıllı Kayıt Defteri Temizleme', 'Anlık Ağ Gecikme Analizi', 'Detaylı Donanım İzleme', 'Tek Tıkla Sistem Hızlandırma'],
                image: 'gorseller/systemic.png',
                link: 'https://github.com/barisys1999/pax-systemic/releases/download/v1.0.0/SystemicPro_Installer.exe',
                changelog: [
                    { version: 'v1.1.0', date: 'Mayıs 2026', notes: ['Hız testi algoritması güncellendi.'] }
                ]
            }
        ];

        let currentCategory = 'all';

        function initGrid() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(p => `
                <div class="product-card" data-category="${p.category}" onclick="openProduct('${p.id}')">
                    <span class="category-label">${p.catName}</span>
                    <h3>${p.title}</h3>
                    <p>${p.shortDesc}</p>
                </div>
            `).join('');
        }

        function updateUI() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.product-card');
            let found = 0;

            cards.forEach(card => {
                const title = card.querySelector('h3').innerText.toLowerCase();
                const cat = card.dataset.category;
                const matchesSearch = title.includes(query);
                const matchesCat = (currentCategory === 'all' || cat === currentCategory);

                if (matchesSearch && matchesCat) {
                    card.style.display = 'block';
                    found++;
                } else {
                    card.style.display = 'none';
                }
            });

            document.getElementById('no-results').style.display = found === 0 ? 'block' : 'none';
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateUI();
        }

        function openProduct(id) {
            const p = products.find(x => x.id === id);
            if (!p) return;

            document.getElementById('det-title').innerText = p.title;
            document.getElementById('det-sub').innerText = p.subtitle;
            document.getElementById('det-desc').innerText = p.fullDesc;
            document.getElementById('det-btn').href = p.link;
            
            const media = document.getElementById('det-media');
            media.innerHTML = `<img src="${p.image}" alt="${p.title}" onerror="this.parentElement.innerHTML='Görsel Hazırlanıyor'">`;

            document.getElementById('det-features').innerHTML = p.features.map(f => `<li>${f}</li>`).join('');

            document.getElementById('det-changelog').innerHTML = p.changelog.map(l => `
                <div class="timeline-item">
                    <span class="tl-version">${l.version}</span><span class="tl-date">${l.date}</span>
                    <ul class="tl-notes">${l.notes.map(n => `<li>${n}</li>`).join('')}</ul>
                </div>`).join('');

            document.getElementById('main-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
            window.scrollTo(0,0);
        }

        function closeProduct() {
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('main-view').style.display = 'flex';
            switchTab('overview', null);
        }

        function switchTab(tab, e) {
            document.querySelectorAll('.d-tab').forEach(t => t.classList.remove('active'));
            if(e) {
                e.target.classList.add('active');
            } else {
                document.querySelector('.d-tab').classList.add('active');
            }
            document.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');
            document.getElementById('pane-' + tab).style.display = 'block';
        }

        initGrid();
    </script>
</body>
</html>
