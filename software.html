    <style>
        :root {
            --primary: #00F0FF;
            --primary-glow: rgba(0, 240, 255, 0.4);
            --bg-dark: #05070A;
            --panel-bg: rgba(13, 17, 26, 0.6);
            --text-main: #F0F4FA;
            --text-dim: #8A9BB8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-dark); color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh;
            display: flex; flex-direction: column; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.03) 0%, transparent 60%);
        }

        header {
            display: flex; justify-content: flex-start; align-items: center;
            padding: 20px 50px; background: rgba(5, 7, 10, 0.85);
            backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0, 240, 255, 0.1);
            position: sticky; top: 0; z-index: 1000;
        }

        .logo-container { text-decoration: none; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.3s; }
        .logo-container:hover { opacity: 0.8; }
        .logo-text { font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; color: var(--text-main); }
        .logo-text span { color: var(--primary); }

        #main-view { width: 100%; display: flex; flex-direction: column; align-items: center; animation: fadeIn 0.5s ease; }
        .hero { text-align: center; padding: 60px 20px 30px; }
        .hero h1 { font-size: 3.5rem; font-weight: 900; margin-bottom: 10px; color: var(--primary); }
        
        .controls-container { width: 100%; max-width: 800px; padding: 0 20px; margin-bottom: 50px; display: flex; flex-direction: column; gap: 25px; align-items: center; }
        .search-box { width: 100%; max-width: 500px; }
        .search-box input {
            width: 100%; padding: 15px 25px; background: rgba(0, 240, 255, 0.02);
            border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 30px;
            color: var(--text-main); font-size: 1.1rem; outline: none; transition: 0.3s;
        }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }

        .filter-tags { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .filter-btn { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--text-dim); padding: 8px 20px; border-radius: 20px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .filter-btn.active { background: rgba(0, 240, 255, 0.1); border-color: var(--primary); color: var(--primary); }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; width: 100%; max-width: 1200px; padding: 0 20px 80px; }
        .product-card { background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 15px; padding: 30px; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; }
        .product-card:hover { border-color: var(--primary); transform: translateY(-5px); background: rgba(0, 240, 255, 0.03); }
        
        /* Geliştirilen ürünler için özel kart stili */
        .product-card.dev-card { border-style: dashed; border-color: rgba(0, 240, 255, 0.3); }
        .product-card.dev-card:hover { border-color: var(--primary); }

        .category-label { font-size: 0.7rem; color: var(--primary); font-weight: bold; text-transform: uppercase; margin-bottom: 10px; display: block; opacity: 0.8; }
        .product-card h3 { font-size: 1.6rem; margin-bottom: 12px; }
        .product-card p { color: var(--text-dim); font-size: 0.95rem; line-height: 1.5; }

        #detail-view { display: none; max-width: 1100px; margin: 40px auto; padding: 0 20px; animation: slideUp 0.4s ease; }
        .back-btn { background: none; color: var(--text-dim); border: none; font-size: 1rem; cursor: pointer; margin-bottom: 25px; transition: 0.3s; }
        .back-btn:hover { color: var(--primary); }
        
        .detail-header { margin-bottom: 30px; }
        .detail-header h2 { font-size: 3.5rem; color: var(--primary); }
        .detail-header h4 { font-size: 1.3rem; color: var(--text-dim); font-weight: 400; }

        .detail-tabs { display: flex; gap: 30px; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .d-tab { background: none; border: none; color: var(--text-dim); font-size: 1.1rem; padding-bottom: 12px; cursor: pointer; transition: 0.3s; border-bottom: 2px solid transparent; }
        .d-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: bold; }

        .detail-content { display: grid; grid-template-columns: 1fr 1.2fr; gap: 50px; align-items: start; margin-bottom: 50px; }
        .detail-text p { font-size: 1.15rem; line-height: 1.8; color: #C0C8D6; margin-bottom: 25px; }
        .feature-list { list-style: none; }
        .feature-list li { margin-bottom: 12px; padding-left: 25px; position: relative; color: var(--text-main); }
        .feature-list li::before { content: '▹'; color: var(--primary); position: absolute; left: 0; font-weight: bold; }

        .detail-media { position: relative; background: #000; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; aspect-ratio: 16/10; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .detail-media img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        
        /* Slider ve Overlay Stilleri */
        .media-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 10, 0.6); backdrop-filter: blur(4px);
            color: var(--primary); font-size: 1rem; font-weight: bold; letter-spacing: 2px;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: 0.3s; cursor: zoom-in; z-index: 5;
        }
        .detail-media:hover .media-overlay { opacity: 1; }

        .slider-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(5, 7, 10, 0.7); color: var(--primary);
            border: 1px solid rgba(0, 240, 255, 0.3); padding: 12px 18px;
            cursor: pointer; z-index: 10; font-size: 1.5rem;
            border-radius: 8px; transition: 0.3s; backdrop-filter: blur(4px);
        }
        .slider-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary-glow); }
        .slider-btn.prev { left: 15px; }
        .slider-btn.next { right: 15px; }

        .slider-dots {
            position: absolute; bottom: 15px; width: 100%;
            display: flex; justify-content: center; gap: 8px; z-index: 10;
        }
        .dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: rgba(255,255,255,0.3); cursor: pointer; transition: 0.3s;
        }
        .dot.active { background: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
        .dot:hover { background: rgba(0, 240, 255, 0.6); }

        #lightbox { display: none; position: fixed; z-index: 10000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.98); align-items: center; justify-content: center; cursor: zoom-out; animation: fadeIn 0.3s ease; }
        #lightbox img { max-width: 90%; max-height: 90%; border: 1px solid var(--primary); box-shadow: 0 0 50px var(--primary-glow); border-radius: 4px; cursor: default; }

        .timeline { border-left: 2px solid rgba(0, 240, 255, 0.2); padding-left: 30px; margin: 20px 0 50px 10px; }
        .timeline-item { position: relative; margin-bottom: 40px; }
        .timeline-item::before { content: ''; position: absolute; left: -37px; top: 8px; width: 12px; height: 12px; background: var(--bg-dark); border: 2px solid var(--primary); border-radius: 50%; }
        .tl-version { font-size: 1.3rem; font-weight: bold; color: var(--primary); margin-right: 15px; }
        .tl-date { color: var(--text-dim); font-size: 0.9rem; }
        .tl-notes { margin-top: 15px; list-style: none; padding-left: 10px; }
        .tl-notes li { margin-bottom: 8px; color: #C0C8D6; font-size: 0.95rem; }

        .download-section { background: rgba(0, 240, 255, 0.03); border: 1px solid rgba(0, 240, 255, 0.1); border-radius: 20px; padding: 50px; text-align: center; }
        .btn-massive { display: inline-block; background: var(--primary); color: #000; text-decoration: none; padding: 18px 60px; font-size: 1.2rem; font-weight: 900; border-radius: 12px; transition: 0.3s; box-shadow: 0 10px 30px var(--primary-glow); }
        .btn-massive:hover { transform: scale(1.05); box-shadow: 0 15px 40px var(--primary-glow); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 900px) { .detail-content { grid-template-columns: 1fr; } .detail-header h2 { font-size: 2.5rem; } }
    </style>
</head>

    let currentCategory = 'all';
    let currentImages = [];
    let currentImageIndex = 0;

    function initGrid() {
        const grid = document.getElementById('product-grid');
        if(!grid) return;
        grid.innerHTML = products.map(p => {
            
            const clickAction = `onclick="openProduct('${p.id}')"`;
            
            
            const devBadge = p.isDev ? ` <span style="color: var(--text-dim); font-size: 0.9rem; font-weight: normal;">(Geliştiriliyor)</span>` : '';
            
            
            const cardClass = p.isDev ? 'product-card dev-card' : 'product-card';

            return `
                <div class="${cardClass}" data-category="${p.category}" ${clickAction}>
                    <span class="category-label">${p.catName}</span>
                    <h3>${p.title}${devBadge}</h3>
                    <p>${p.shortDesc}</p>
                </div>
            `;
        }).join('');
    }
   
    function updateUI() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.querySelectorAll('.product-card');
        let found = 0;

        cards.forEach(card => {
            const title = card.querySelector('h3').innerText.toLowerCase();
            const cat = card.dataset.category;
            const matchesSearch = title.includes(query);
            const matchesCat = (currentCategory === 'all' || cat === currentCategory);

            if (matchesSearch && matchesCat) {
                card.style.display = 'block';
                found++;
            } else {
                card.style.display = 'none';
            }
        });

        const noRes = document.getElementById('no-results');
        if(noRes) noRes.style.display = found === 0 ? 'block' : 'none';
    }

    function setCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateUI();
    }

    function openProduct(id) {
        const p = products.find(x => x.id === id);
        if (!p) return;
        
        
        switchTab('overview', null);
        
        const downloadBtn = document.getElementById('det-btn');
        document.getElementById('det-title').innerText = p.title;
        document.getElementById('det-sub').innerText = p.subtitle;
        document.getElementById('det-desc').innerText = p.fullDesc;
        downloadBtn.href = p.link;

        // --- BUTON DURUMU AYARLAMA ---
        if (p.isDev) { 
            // geliştirme aşamasında
            downloadBtn.innerText = 'Geliştirilme Aşamasında';
            downloadBtn.style.pointerEvents = 'none'; 
            downloadBtn.style.background = '#1A2333'; 
            downloadBtn.style.color = 'var(--text-dim)';
            downloadBtn.style.boxShadow = 'none'; 
        } else if (p.link.startsWith('https://mail.google.com/')) {
            // mail talebi
            downloadBtn.innerText = 'Talep Et';
            downloadBtn.style.pointerEvents = 'auto';
            downloadBtn.style.background = 'var(--primary)';
            downloadBtn.style.color = '#000';
            downloadBtn.style.boxShadow = '0 10px 30px var(--primary-glow)';
        } else {
            // Normal indirme
            downloadBtn.innerText = 'İndir';
            downloadBtn.style.pointerEvents = 'auto';
            downloadBtn.style.background = 'var(--primary)';
            downloadBtn.style.color = '#000';
            downloadBtn.style.boxShadow = '0 10px 30px var(--primary-glow)';
        }
        
        currentImages = p.images && p.images.length > 0 ? p.images : (p.image ? [p.image] : []);
        currentImageIndex = 0;
        updateMediaView();

        document.getElementById('det-features').innerHTML = p.features.map(f => `<li>${f}</li>`).join('');
        document.getElementById('det-changelog').innerHTML = p.changelog.map(l => `
            <div class="timeline-item">
                <span class="tl-version">${l.version}</span><span class="tl-date">${l.date}</span>
                <ul class="tl-notes">${l.notes.map(n => `<li>${n}</li>`).join('')}</ul>
            </div>`).join('');

        document.getElementById('main-view').style.display = 'none';
        document.getElementById('detail-view').style.display = 'block';
        window.scrollTo(0,0);
    }
    
    function updateMediaView() {
        const media = document.getElementById('det-media');
        if (currentImages.length === 0) {
            media.innerHTML = 'Görsel Bulunamadı';
            return;
        }

       
        let html = `<img src="${currentImages[currentImageIndex]}" loading="lazy" onerror="this.onerror=null; this.style.display='none'; const p=document.createElement('p'); p.innerText='Görsel Hazırlanıyor'; p.style.color='var(--text-dim)'; this.parentElement.appendChild(p);">`;
        html += `<div class="media-overlay" onclick="openLightbox()">GÖRÜNTÜLE</div>`;

        if (currentImages.length > 1) {
            html += `<button class="slider-btn prev" onclick="changeImage(-1, event)">&#10094;</button>`;
            html += `<button class="slider-btn next" onclick="changeImage(1, event)">&#10095;</button>`;
            
            html += `<div class="slider-dots">`;
            currentImages.forEach((_, i) => {
                html += `<span class="dot ${i === currentImageIndex ? 'active' : ''}" onclick="setImage(${i}, event)"></span>`;
            });
            html += `</div>`;
        }

        media.innerHTML = html;
    }

    function changeImage(dir, event) {
        if(event) event.stopPropagation(); 
        currentImageIndex += dir;
        if (currentImageIndex < 0) currentImageIndex = currentImages.length - 1;
        if (currentImageIndex >= currentImages.length) currentImageIndex = 0;
        updateMediaView();
    }

    function setImage(idx, event) {
        if(event) event.stopPropagation();
        currentImageIndex = idx;
        updateMediaView();
    }

    function closeProduct() {
        document.getElementById('detail-view').style.display = 'none';
        document.getElementById('main-view').style.display = 'flex';
        switchTab('overview', null);
    }

    function switchTab(tab, e) {
        document.querySelectorAll('.d-tab').forEach(t => t.classList.remove('active'));
        
        if(e && e.target) {
            e.target.classList.add('active');
        } else {
            
            const targetIndex = tab === 'overview' ? 0 : 1;
            const targetTab = document.querySelectorAll('.d-tab')[targetIndex];
            if(targetTab) targetTab.classList.add('active');
        }
        
        document.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');
        const targetPane = document.getElementById('pane-' + tab);
        if(targetPane) targetPane.style.display = 'block';
    }

    function openLightbox() {
        if(currentImages.length === 0) return;
        const lb = document.getElementById('lightbox');
        
        let html = `<img id="lightbox-img" src="${currentImages[currentImageIndex]}" loading="lazy" onclick="event.stopPropagation()">`;
        
        if (currentImages.length > 1) {
            html += `<button class="slider-btn prev" style="position:fixed; left: 5%;" onclick="changeLightboxImage(-1, event)">&#10094;</button>`;
            html += `<button class="slider-btn next" style="position:fixed; right: 5%;" onclick="changeLightboxImage(1, event)">&#10095;</button>`;
        }

        lb.innerHTML = html;
        lb.style.display = 'flex';
    }

    function changeLightboxImage(dir, event) {
        if(event) event.stopPropagation();
        currentImageIndex += dir;
        if (currentImageIndex < 0) currentImageIndex = currentImages.length - 1;
        if (currentImageIndex >= currentImages.length) currentImageIndex = 0;
        
        const lbImg = document.getElementById('lightbox-img');
        if(lbImg) lbImg.src = currentImages[currentImageIndex];
        updateMediaView(); 
    }

    // Sayfa yüklendiğinde çalıştır
    window.onload = initGrid;
</script>
