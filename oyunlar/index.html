<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../favicon.png">
    <title>BarisByte Games | Oyun Kataloğu</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/catalog.css">

    <!-- Oyunlar teması: purple -->
    <style>
        :root {
            --accent:      #A855F7;
            --accent-glow: rgba(168, 85, 247, 0.25);
            --accent-soft: rgba(168, 85, 247, 0.06);
        }
        body {
            background-image: radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.05) 0%, transparent 55%);
        }
        .download-section {
            background: rgba(168, 85, 247, 0.03);
            border-color: rgba(168, 85, 247, 0.12);
        }
    </style>
</head>
<body>

<!-- ── HEADER ───────────────────────────── -->
<header class="site-header">
    <a href="../index.html" class="logo">PAX <em>SYSTEMIC</em></a>
    <div class="header-right">
        <a href="index.html"                  class="nav-chip active-purple">Oyunlar</a>
        <a href="../yazilimlar/index.html"     class="nav-chip">Yazılımlar</a>
    </div>
</header>

<!-- ── MAIN VIEW ────────────────────────── -->
<div id="main-view" style="display:flex; flex-direction:column; align-items:center;">

    <div class="catalog-hero">
        <h1>BarisByte Games</h1>
        <p>Atmosfer, keşif ve sınırları zorlayan mekanikler.</p>
    </div>

    <div class="controls">
        <div class="search-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Oyun ara..." oninput="updateGrid()">
        </div>
        <div class="filter-row">
            <button class="filter-btn active" onclick="setCategory('all', this)">Tümü</button>
            <button class="filter-btn" onclick="setCategory('korku', this)">Korku / Gerilim</button>
            <button class="filter-btn" onclick="setCategory('arcade', this)">Arcade / Mobil</button>
            <button class="filter-btn" onclick="setCategory('macera', this)">Aksiyon / Macera</button>
        </div>
    </div>

    <div id="catalog-grid"></div>
    <div id="no-results">Aradığınız kritere uygun oyun bulunamadı.</div>

</div>

<!-- ── DETAIL VIEW ──────────────────────── -->
<div id="detail-view">

    <button class="back-btn" onclick="closeProduct()">
        ← Oyunlara Dön
    </button>

    <div class="det-header">
        <div class="det-header__icon">
            <img id="det-icon" src="" alt="">
            <span id="det-icon-placeholder" class="det-header__icon-placeholder" style="display:none"></span>
        </div>
        <div class="det-header__text">
            <h2 id="det-title"></h2>
            <h4 id="det-sub"></h4>
        </div>
    </div>

    <div class="det-tabs">
        <button class="d-tab active" onclick="switchTab('overview', event)">Genel Bakış</button>
        <button class="d-tab"        onclick="switchTab('changelog', event)">Devlog / Sürüm Notları</button>
    </div>

    <div id="pane-overview" class="tab-pane" style="display:block;">
        <div class="det-overview">
            <div class="det-text">
                <p id="det-desc"></p>
                <ul class="feature-list" id="det-features"></ul>
            </div>
            <div class="det-media" id="det-media"></div>
        </div>
    </div>

    <div id="pane-changelog" class="tab-pane" style="display:none;">
        <div class="timeline" id="det-changelog"></div>
    </div>

    <div class="download-section">
        <a href="#" id="det-btn" class="btn-download">↓ İndir</a>
    </div>

</div>

<div id="lightbox" onclick="this.style.display='none'"></div>

<script src="../js/games-data.js"></script>
<script src="../js/catalog.js"></script>
<script>
    window.onload = () => initCatalog(GAMES_PRODUCTS);
</script>

</body>
</html>
